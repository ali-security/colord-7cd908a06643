name: Node.js CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional jest test path pattern; empty runs the full suite"
        required: false
        default: ""

env:
  NPM_CONFIG_REGISTRY: https://:2021-12-16T17%3A29%3A28.497000Z@time-machines-npm.sealsecurity.io/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [12.x, 14.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx jest --coverage ${{ inputs.test-filter }}
          else
            npm run test
          fi

  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 14.18.2
        uses: actions/setup-node@v4
        with:
          node-version: 14.18.2
      - run: npm install
      - run: npm run build
      # Mirrors the package's `release` script: npm run build && cp *.json dist && cp *.md dist && npm publish dist
      - run: cp *.json dist && cp *.md dist && npm pack ./dist
      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: colord-tgz
          path: colord-2.9.2.tgz
          if-no-files-found: error
